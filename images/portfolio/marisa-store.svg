<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf1f5"/>
      <stop offset="1" stop-color="#f6dbe6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b9cf"/>
      <stop offset="1" stop-color="#d9709a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- awning -->
  <g>
    <rect x="60" y="70" width="480" height="24" rx="6" fill="#1f2a37"/>
    <g>
      <path d="M60 94 h60 v44 a30 30 0 0 1 -60 0z" fill="#d9709a"/>
      <path d="M120 94 h60 v44 a30 30 0 0 1 -60 0z" fill="#fff"/>
      <path d="M180 94 h60 v44 a30 30 0 0 1 -60 0z" fill="#d9709a"/>
      <path d="M240 94 h60 v44 a30 30 0 0 1 -60 0z" fill="#fff"/>
      <path d="M300 94 h60 v44 a30 30 0 0 1 -60 0z" fill="#d9709a"/>
      <path d="M360 94 h60 v44 a30 30 0 0 1 -60 0z" fill="#fff"/>
      <path d="M420 94 h60 v44 a30 30 0 0 1 -60 0z" fill="#d9709a"/>
      <path d="M480 94 h60 v44 a30 30 0 0 1 -60 0z" fill="#fff"/>
    </g>
  </g>

  <!-- product cards -->
  <!-- perfume -->
  <g transform="translate(60 190)">
    <rect width="150" height="220" rx="14" fill="#fff"/>
    <rect x="62" y="22" width="26" height="22" rx="3" fill="#1f2a37"/>
    <rect x="68" y="44" width="14" height="12" fill="#c7cfd8"/>
    <rect x="35" y="56" width="80" height="90" rx="16" fill="url(#glass)"/>
    <rect x="48" y="84" width="54" height="30" rx="4" fill="#fff" opacity=".85"/>
    <rect x="44" y="64" width="10" height="60" rx="5" fill="#fff" opacity=".35"/>
    <rect x="16" y="164" width="90" height="9" rx="4" fill="#1f2a37"/>
    <text x="16" y="200" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="18" fill="#d9709a">R$ 129,90</text>
  </g>
  <!-- fitness top -->
  <g transform="translate(225 190)">
    <rect width="150" height="220" rx="14" fill="#fff"/>
    <path d="M40 30 L60 22 Q75 38 90 22 L110 30 L104 60 L118 64 L110 140 H40 L32 64 L46 60 Z" fill="#2eca7f"/>
    <path d="M44 100 H106" stroke="#fff" stroke-width="5"/>
    <rect x="16" y="164" width="100" height="9" rx="4" fill="#1f2a37"/>
    <text x="16" y="200" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="18" fill="#d9709a">R$ 89,90</text>
  </g>
  <!-- dumbbell -->
  <g transform="translate(390 190)">
    <rect width="150" height="220" rx="14" fill="#fff"/>
    <g transform="translate(75 90) rotate(-25)">
      <rect x="-40" y="-5" width="80" height="10" rx="4" fill="#9aa7b5"/>
      <rect x="-58" y="-26" width="20" height="52" rx="6" fill="#9e51f3"/>
      <rect x="38" y="-26" width="20" height="52" rx="6" fill="#9e51f3"/>
      <rect x="-68" y="-16" width="10" height="32" rx="4" fill="#6c2fc0"/>
      <rect x="58" y="-16" width="10" height="32" rx="4" fill="#6c2fc0"/>
    </g>
    <rect x="16" y="164" width="80" height="9" rx="4" fill="#1f2a37"/>
    <text x="16" y="200" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="18" fill="#d9709a">R$ 59,90</text>
  </g>

  <!-- promo tag -->
  <g transform="translate(470 170) rotate(12)">
    <circle r="36" fill="#ff5a7a"/>
    <text y="-2" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="18" fill="#fff">-20%</text>
    <text y="16" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="11" fill="#fff">PROMO</text>
  </g>

  <!-- title -->
  <text x="60" y="490" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="32" fill="#1f2a37">Marisa Store</text>
  <text x="60" y="524" font-family="Roboto, Arial, sans-serif" font-size="17" fill="#8a4b65">Catálogo de perfumaria e moda fitness</text>
  <text x="60" y="556" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="14" fill="#d9709a" letter-spacing="3">VITRINE ONLINE · REACT</text>
</svg>
