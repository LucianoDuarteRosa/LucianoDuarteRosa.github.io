<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a37"/>
      <stop offset="1" stop-color="#27384a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- floor -->
  <rect x="0" y="470" width="600" height="130" fill="#1a2330"/>
  <path d="M0 470 H600" stroke="#2eca7f" stroke-width="3" opacity=".6"/>

  <!-- rack -->
  <g stroke="#9aa7b5" stroke-width="8" stroke-linecap="round">
    <line x1="60" y1="110" x2="60" y2="470"/>
    <line x1="300" y1="110" x2="300" y2="470"/>
    <line x1="540" y1="110" x2="540" y2="470"/>
  </g>
  <g fill="#f39c3d">
    <rect x="52" y="220" width="496" height="10" rx="2"/>
    <rect x="52" y="340" width="496" height="10" rx="2"/>
    <rect x="52" y="460" width="496" height="10" rx="2"/>
  </g>

  <!-- pallets + boxes level 1 -->
  <g>
    <rect x="80" y="205" width="200" height="14" fill="#8b6a45"/>
    <rect x="90" y="140" width="85" height="65" fill="#c9a877"/>
    <rect x="180" y="140" width="90" height="65" fill="#d8b98a"/>
    <rect x="320" y="205" width="200" height="14" fill="#8b6a45"/>
    <rect x="330" y="150" width="180" height="55" fill="#c9a877"/>
    <line x1="420" y1="150" x2="420" y2="205" stroke="#a88a5e" stroke-width="3"/>
  </g>
  <!-- level 2 -->
  <g>
    <rect x="80" y="325" width="200" height="14" fill="#8b6a45"/>
    <rect x="90" y="255" width="180" height="70" fill="#d8b98a"/>
    <line x1="180" y1="255" x2="180" y2="325" stroke="#b39468" stroke-width="3"/>
    <rect x="320" y="325" width="200" height="14" fill="#8b6a45"/>
    <rect x="330" y="265" width="85" height="60" fill="#c9a877"/>
  </g>
  <!-- level 3 -->
  <g>
    <rect x="80" y="445" width="200" height="14" fill="#8b6a45"/>
    <rect x="95" y="380" width="80" height="65" fill="#c9a877"/>
    <rect x="320" y="445" width="200" height="14" fill="#8b6a45"/>
    <rect x="330" y="375" width="180" height="70" fill="#d8b98a"/>
  </g>

  <!-- address tags -->
  <g font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="14" fill="#1f2a37">
    <rect x="72" y="232" width="74" height="22" rx="4" fill="#2eca7f"/>
    <text x="109" y="248" text-anchor="middle">R1-P01</text>
    <rect x="312" y="232" width="74" height="22" rx="4" fill="#2eca7f"/>
    <text x="349" y="248" text-anchor="middle">R1-P02</text>
    <rect x="72" y="352" width="74" height="22" rx="4" fill="#2eca7f"/>
    <text x="109" y="368" text-anchor="middle">R2-P01</text>
    <rect x="312" y="352" width="74" height="22" rx="4" fill="#9e51f3"/>
    <text x="349" y="368" text-anchor="middle" fill="#fff">R2-P02</text>
  </g>
  <!-- empty slot highlight -->
  <rect x="425" y="262" width="95" height="63" rx="6" fill="none" stroke="#9e51f3" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- barcode label card -->
  <g transform="translate(360 490)">
    <rect width="200" height="84" rx="10" fill="#fff"/>
    <g fill="#1f2a37">
      <rect x="16" y="14" width="4" height="40"/><rect x="24" y="14" width="2" height="40"/>
      <rect x="30" y="14" width="6" height="40"/><rect x="40" y="14" width="2" height="40"/>
      <rect x="46" y="14" width="4" height="40"/><rect x="54" y="14" width="2" height="40"/>
      <rect x="60" y="14" width="6" height="40"/><rect x="70" y="14" width="3" height="40"/>
      <rect x="77" y="14" width="2" height="40"/><rect x="83" y="14" width="5" height="40"/>
      <rect x="92" y="14" width="2" height="40"/><rect x="98" y="14" width="4" height="40"/>
    </g>
    <text x="16" y="72" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#49515d">LOTE 0427 · TON B</text>
    <text x="120" y="34" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="20" fill="#2eca7f">48,6</text>
    <text x="120" y="52" font-family="Roboto, Arial, sans-serif" font-size="13" fill="#49515d">m² no pulmão</text>
  </g>

  <!-- title -->
  <text x="40" y="530" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="30" fill="#fff">CasaMattos</text>
  <text x="40" y="562" font-family="Roboto, Arial, sans-serif" font-size="17" fill="#2eca7f">Gestão de armazém · V2</text>
  <text x="40" y="70" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="16" fill="#9aa7b5" letter-spacing="3">WMS · .NET 8 · REACT</text>
</svg>
